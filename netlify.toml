[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "https://kuralkoodalsemmozhifoundation.org/*"
  to = "https://kuralkoodal.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kuralkoodalsemmozhifoundation.org/*"

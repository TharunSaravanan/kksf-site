<script>

  ];

  var grid = document.getElementById('shorts-grid');

  SHORT_IDS.forEach(function(id) {
    var card = document.createElement('div');
    card.className = 'short-card';
    card.innerHTML =
      '<img src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="YouTube Short" loading="lazy">' +
      '<button class="short-play" aria-label="Play video">' +
        '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="#212121"/></svg>' +
      '</button>';
    card.addEventListener('click', function() {
      card.innerHTML =
        '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1" title="YouTube Short" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>';
    }, { once: true });
    grid.appendChild(card);
  });
</script>
